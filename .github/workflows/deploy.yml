name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build || npm run build

      - name: Deploy over SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: 93.127.178.113
          REMOTE_PORT: 65002
          REMOTE_USER: u297877675
          SOURCE: "out/"
          TARGET: "/home/u297877675/domains/indigo-rat-579105.hostingersite.com/public_html/"
          ARGS: "-rlgoDzvc -i --delete"
